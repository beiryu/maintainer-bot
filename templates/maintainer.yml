# .github/workflows/maintainer.yml — maintainer-bot for this repository.
# Settings live in .github/maintainer-bot.yml. Secrets: COPILOT_TOKEN (repo secret) and
# MAINTAINER_TOKEN (environment "bot": a fine-grained PAT of the maintainer for this repo only, with
# Contents, Issues and Pull requests read/write). The bot acts as the maintainer: it opens
# issues and PRs under their name, with commits GitHub signs.
name: maintainer-bot

on:
  issues:
    types: [opened, assigned]                # assigned to you → implemented. Not `edited`: the bot edits the dashboard
  issue_comment:
    types: [created]                         # /approve and other commands on the dashboard; comments on the bot's PRs
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]             # other people's PRs: reviewed from the diff and CI, never run
  schedule:
    - cron: '0 2 * * *'                      # daily 09:00 Vietnam: upstream sources + audit
  workflow_dispatch:

# The most GITHUB_TOKEN may do in the called workflow: its agent job reads with these, its
# publish job uses the maintainer's PAT and asks for nothing.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

# One pass at a time; a second event waits instead of running alongside.
concurrency:
  group: maintainer-bot
  cancel-in-progress: false

jobs:
  bot:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    # Pinned to a commit: that revision of the bot is what runs with the secrets (Dependabot bumps it).
    uses: beiryu/maintainer-bot/.github/workflows/agent.yml@0000000000000000000000000000000000000000 # v1
    with:
      draft_prs: true                        # pilot: PRs open as drafts; set false once trusted
    # MAINTAINER_TOKEN lives in the environment "bot", which only the called workflow's publish job
    # enters; inherit is the only way an environment secret reaches a called workflow.
    secrets: inherit
