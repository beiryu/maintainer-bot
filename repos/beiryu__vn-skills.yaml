full_name: beiryu/vn-skills
default_branch: main
branch_prefix: ""
branch_name: "{{type}}/{{number}}-{{slug}}"
# Work = open issues assigned to github_user (approve p<n>, approve d<n> --take, `take <n>`, or assigning on GitHub).
pick: assigned
# Reserved for human contributors per CONTRIBUTING.md, or waiting on a decision.
skip_labels: ["status: blocked", "help wanted", "good first issue"]
# One test FILE per run: vitest test names contain spaces, which the bot's test vars reject.
focused_test: "pnpm install --frozen-lockfile --prefer-offline >/dev/null && pnpm build >/dev/null && pnpm exec vitest run {{file}}"
gate:
  - "pnpm install --frozen-lockfile --prefer-offline"
  - "pnpm build"
  - "pnpm typecheck"
  - "pnpm exec vitest run"
  - "pnpm format:check"
  - "pnpm build-data:check"   # needs the network; last so a blip reads as an environment failure
forbidden_paths:
  - ".github/"
  - "CODEOWNERS"
  - "TRADEMARK.md"
  - "GOVERNANCE.md"
  - "release-please-config.json"
  - ".release-please-manifest.json"
  - "pnpm-lock.yaml"
  - "packages/core/data/"        # generated by scripts/build-data.ts only
roadmap_file: ROADMAP.md
pr_types: [feat, fix, data, docs, test, refactor, perf, build, ci, chore, revert]
pr_scopes: [vietqr, vn-address, vn-tax-id, vn-money-words, vn-lunar, vn-einvoice, core, cli, mcp, skill, data, deps, repo, release]
audit_files: [README.md, CONTRIBUTING.md, AGENTS.md, vn-skills-SPEC.md, packages/core/data/SOURCES.md]
sources:
  - { name: provinces, kind: github, repo: thanglequoc/vietnamese-provinces-database, pinned_from: scripts/build-data.ts, paths: [json/] }
  - { name: adminunits, kind: github, repo: tranngocminhhieu/vietnamadminunits, pinned_from: scripts/build-data.ts, paths: [vietnamadminunits/data/] }
  - { name: banks, kind: github, repo: xuannghia/vietnam-qr-pay, pinned_from: scripts/build-data.ts, paths: [src/] }
agent_disclosure: ""   # AI use is stated once in CONTRIBUTING.md
notes: |
  Core is offline: no fetch/HTTP in packages/core; only scripts/build-data.ts downloads.
  Never hand-edit packages/core/data/*.json; data changes go through scripts/build-data.ts + SOURCES.md with pinned SHAs.
  Never invent Vietnamese facts (bank BINs, ward names, holiday dates, tax rules, thresholds): if the issue does not cite a source and the repo does not contain it, stop (done=false) and say so.
  A new skill = core function(s) + CLI command (packages/cli/src/commands) + MCP tool (packages/mcp/src/server.ts) + skills/<name>/SKILL.md with Vietnamese trigger words + >= 20 tests in tests/<name>.test.ts + an entry in tests/skills.test.ts.
  A bug fix adds a golden case to tests/golden/<skill>.json (loaded by tests/golden.ts) when the case is pure input -> output.
  For a FEATURE issue the test written first is the acceptance test: it fails on the base because the export/command/tool does not exist yet. That is the expected failure.
  Conventional Commits; the PR title is squash-merged and must be "type(scope): subject" with a scope from the repo's PR lint (see pr_scopes). PR body: "Closes #N" and the RM-NNN id when the issue has one.
  Run `pnpm format` before finishing; CI runs format:check. Code, issues and PRs in English; user docs also in Vietnamese (README.vi.md) when README.md changes.
  ROADMAP.md `status:` lines can be stale: the open-issue list is the truth about what is filed. Do not edit ROADMAP.md: the `done (#PR)` line is added when the PR is opened. End every new file with a newline.
