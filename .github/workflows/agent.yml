# maintainer-bot as a reusable workflow. A repo calls it pinned to a commit (see
# templates/maintainer.yml) and keeps its own settings in .github/maintainer-bot.yml; the
# bot's code is checked out at that same commit. One run = one pass, in two jobs:
#
#   agent    reads the repo with the job's own read-only token, runs the agents and the gate,
#            and hands over nothing but a state file (artifact). The model credential is the
#            only secret here, and the runtime strips it from the agents' shell.
#   publish  has the maintainer's fine-grained PAT (environment "bot") and no model credential:
#            carries out what was ticked on the dashboard, opens the PRs the agent got ready
#            (commits are made through the API, so GitHub signs them under the maintainer's
#            account), renders the dashboard issue and saves the state on the branch
#            maintainer-bot/state.
#
# Dashboard ticks and commands need no agent: for those events only `publish` runs.
name: maintainer-bot

on:
  workflow_call:
    inputs:
      draft_prs:
        description: open pull requests as drafts (for a pilot)
        type: boolean
        default: false
    secrets:
      MODEL_TOKEN:
        description: the model credential (a Copilot PAT with only "Copilot Requests", or an Anthropic key)
        required: true
      BOT_PAT:
        description: fine-grained PAT of the maintainer, this repo only (contents, issues, pull requests read/write)
        # Not `required`: it lives in the caller's environment "bot", which the caller's job cannot
        # see; the publish job below enters that environment and gets it. A missing token fails there.
        required: false

env:
  BOT: ${{ github.workspace }}/.bot
  STATE: ${{ github.workspace }}/state/state.json

jobs:
  agent:
    # Not for the dashboard's own events, nor for edits of other issues; a CI run only when it failed.
    if: >-
      !(contains(github.event.issue.body, 'maintainer-bot:dashboard') && (github.event_name == 'issues' || github.event_name == 'issue_comment'))
      && !(github.event_name == 'issues' && github.event.action == 'edited')
      && (github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch maintainer-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beiryu/maintainer-bot
          ref: ${{ github.job_workflow_sha }}   # the very revision the caller pinned in `uses:`
          path: .bot
          persist-credentials: false
      - name: Read the repo's bot config
        id: cfg
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/maintainer-bot.yml" -H 'Accept: application/vnd.github.raw' > "$BOT/repo-config.yml"
          cd "$BOT" && npm ci --no-audit --no-fund --silent
          npm run -s maintainer-bot -- ci setup repo-config.yml | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.cfg.outputs.node }}
      - name: pnpm
        if: steps.cfg.outputs.pnpm != ''
        run: npm i -g "${{ steps.cfg.outputs.pnpm }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.cfg.outputs.go != ''
        with:
          go-version: ${{ steps.cfg.outputs.go }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.cfg.outputs.uv != ''
      - name: Agent runtime
        run: |
          case "${{ steps.cfg.outputs.runtime }}" in
            copilot) npm i -g @github/copilot@1.0.95 && copilot --version ;;
            claude)  curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
          esac
      - name: Load state
        run: |
          cd "$BOT" && npm run -s maintainer-bot -- --state "$STATE" ci state-pull --repo "$GITHUB_REPOSITORY" --bot-config repo-config.yml
      - name: Run the agents
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          AUTH_ENV: ${{ steps.cfg.outputs.auth_env }}
        run: |
          export "$AUTH_ENV=$MODEL_TOKEN"; unset MODEL_TOKEN
          cd "$BOT" && npm run -s maintainer-bot -- --state "$STATE" ci agent --repo "$GITHUB_REPOSITORY" --bot-config repo-config.yml
      - name: Hand over the state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintainer-bot-state
          path: state/state.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: agent
    # Runs after the agent, or alone for dashboard events; never when the agent step broke.
    if: >-
      always() && (needs.agent.result == 'success' || needs.agent.result == 'skipped')
      && !(github.event_name == 'issues' && github.event.action == 'edited' && !contains(github.event.issue.body, 'maintainer-bot:dashboard'))
      && (github.event_name != 'check_suite' || github.event.check_suite.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bot
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.BOT_PAT }}
    steps:
      - name: Fetch maintainer-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beiryu/maintainer-bot
          ref: ${{ github.job_workflow_sha }}   # the very revision the caller pinned in `uses:`
          path: .bot
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read the repo's bot config
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/maintainer-bot.yml" -H 'Accept: application/vnd.github.raw' > "$BOT/repo-config.yml"
          cd "$BOT" && npm ci --no-audit --no-fund --silent
      - name: State from the agent step
        if: needs.agent.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintainer-bot-state
          path: state
      - name: State from the branch
        if: needs.agent.result != 'success'
        run: |
          cd "$BOT" && npm run -s maintainer-bot -- --state "$STATE" ci state-pull --repo "$GITHUB_REPOSITORY" --bot-config repo-config.yml
      - name: Publish
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::BOT_PAT is empty: add it as a secret of the environment \"bot\" in this repository"; exit 1; fi
          cd "$BOT" && npm run -s maintainer-bot -- --state "$STATE" ci publish --repo "$GITHUB_REPOSITORY" --bot-config repo-config.yml \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            ${{ inputs.draft_prs && '--draft' || '' }}
